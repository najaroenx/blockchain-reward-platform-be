services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reward
      POSTGRES_USER: reward
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reward_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reward -d reward"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reward_postgres:
