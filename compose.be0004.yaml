x-be0004-database-env: &be0004-database-env
  DATABASE_URL: "${REWARD_DATABASE_URL:-postgresql+psycopg://postgres:${BE0004_POSTGRES_PASSWORD:?Set the existing BE-0004 PostgreSQL password}@postgres:5432/reward}"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${BE0004_POSTGRES_PASSWORD:?Set the existing BE-0004 PostgreSQL password}"
    ports: !override ["127.0.0.1:5433:5432"]
  migrate:
    environment: *be0004-database-env
  api:
    environment: *be0004-database-env
  worker:
    environment: *be0004-database-env
  indexer:
    environment: *be0004-database-env

volumes:
  reward_postgres:
    external: true
    name: "${REWARD_DB_VOLUME_NAME:-blockchain-reward-platform_reward_db_data}"
